<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Compass Memoria</title>
    <style>
        body, html { margin: 0; padding: 0; font-family: 'Helvetica Neue', Arial, sans-serif; background: #111; color: #fff; overflow-x: hidden; }
        .app-container { 
            position: relative; width: 100%; max-width: 500px; margin: 0 auto; min-height: 100vh; 
            background: url('bg/bg_home.png') no-repeat center top / cover fixed; 
            display: flex; flex-direction: column;
        }
        .screen { display: none; flex-direction: column; align-items: center; background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(8px); padding-bottom: 30px; box-sizing: border-box; flex: 1; width: 100%; }
        .screen.active { display: flex; }
        .title-logo { width: 80%; max-width: 280px; margin: 20px 0; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5)); }
        .page-title { font-size: 18px; margin: 20px 0; border-bottom: 2px solid gold; padding-bottom: 5px; color: gold; font-weight: bold; }
        .ui-btn { width: 90%; max-width: 250px; cursor: pointer; transition: 0.1s; margin: 10px auto; }
        .btn-home-top { position: absolute; top: 15px; right: 15px; width: 45px; height: 45px; cursor: pointer; z-index: 50; }
        .status-board { background: rgba(0, 0, 0, 0.8); border: 1px solid #444; border-radius: 10px; padding: 12px; width: 85%; font-size: 13px; margin-bottom: 15px; }
        .status-board span { color: gold; font-weight: bold; }
        .home-center-chara { flex: 1; display: flex; justify-content: center; align-items: center; }
        .home-center-chara img { max-width: 90%; max-height: 40vh; object-fit: contain; }
        .main-menu { display: flex; justify-content: center; width: 95%; gap: 10px; margin-bottom: 20px; }
        .menu-item { display: flex; flex-direction: column; align-items: center; cursor: pointer; width: 30%; }
        .menu-btn { width: 100%; margin-bottom: 5px; }
        .menu-text { font-size: 11px; font-weight: bold; }
        .card-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; padding: 10px; }
        .card { width: 90px; height: 135px; background: #222; border-radius: 8px; overflow: hidden; border: 2px solid #555; }
        .card img { width: 100%; height: 100%; object-fit: cover; }
        .gallery-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 92%; padding: 10px 0; }
        .gallery-item { aspect-ratio: 2 / 3; border-radius: 6px; overflow: hidden; border: 2px solid #444; cursor: pointer; filter: brightness(0.3); background: #222; }
        .gallery-item.owned { filter: brightness(1); border-color: gold; }
        .gallery-item img { width: 100%; height: 100%; object-fit: cover; }
        .gallery-section-title { grid-column: span 3; text-align: center; color: gold; margin: 15px 0 5px; font-weight: bold; }
        .detail-img-wrapper { width: 80%; max-width: 300px; border: 2px solid gold; border-radius: 15px; margin-bottom: 20px; overflow: hidden; }
        .detail-img-wrapper img { width: 100%; display: block; }
        .profile-board { width: 90%; background: rgba(20, 20, 20, 0.9); border-radius: 15px; padding: 20px; box-sizing: border-box; text-align: left; margin-bottom: 20px; border: 1px solid #444; }
        .prof-name-ja { font-size: 22px; color: gold; display: block; margin-bottom: 10px; }
        .prof-story { font-size: 14px; line-height: 1.6; color: #ccc; }
        .btn-back-common { width: 70%; background: #333; color: #fff; padding: 12px; border-radius: 30px; border: 1px solid #666; font-weight: bold; cursor: pointer; margin-top: 10px; text-align: center; }
    </style>
</head>
<body>
<div class="app-container">
    <div id="screen-home" class="screen active">
        <img src="ui/title_logp.png" class="title-logo">
        <div class="status-board">レア総数: <span id="rareCount">0</span> / ノーマル: <span id="normalCount">0</span></div>
        <div class="home-center-chara"><img id="homeRandomChara" src=""></div>
        <div class="main-menu">
            <div class="menu-item" onclick="switchScreen('screen-gacha-confirm')"><img src="ui/btn_gacha.png" class="menu-btn"><div class="menu-text">ガチャ</div></div>
            <div class="menu-item" onclick="openGallery()"><img src="ui/icon_gallery.png" class="menu-btn"><div class="menu-text">図鑑</div></div>
            <div class="menu-item" onclick="openCombine()"><img src="ui/icon_comdine.png" class="menu-btn"><div class="menu-text">進化</div></div>
        </div>
    </div>
    <div id="screen-gacha-confirm" class="screen">
        <img src="ui/icon_home.png" class="btn-home-top" onclick="switchScreen('screen-home')">
        <div class="page-title">SPIN GACHA</div>
        <img src="ui/btn_gacha.png" class="ui-btn" onclick="executeGacha()">
        <div id="rescueBtnArea"></div>
    </div>
    <div id="screen-video" class="screen">
        <video id="gachaVideo" playsinline style="width:100%; height:100%;"></video>
        <div onclick="skipVideo()" style="position:absolute; bottom:30px; right:20px; background:rgba(0,0,0,0.6); color:#fff; padding:10px 20px; border-radius:5px;">スキップ >></div>
    </div>
    <div id="screen-result" class="screen">
        <div class="page-title">RESULT</div>
        <div class="card-container" id="resultDisplay"></div>
        <img src="ui/btn_confirm.png" class="ui-btn" onclick="switchScreen('screen-home')">
    </div>
    <div id="screen-gallery" class="screen">
        <img src="ui/icon_home.png" class="btn-home-top" onclick="switchScreen('screen-home')">
        <div class="page-title">CHARACTER DEX</div>
        <div class="gallery-grid" id="galleryGrid"></div>
        <div class="btn-back-common" onclick="switchScreen('screen-home')">閉じる</div>
    </div>
    <div id="screen-card-detail" class="screen">
        <div class="page-title">CARD DETAIL</div>
        <div class="detail-img-wrapper" onclick="switchScreen('screen-fullscreen')"><img id="detailImg" src=""></div>
        <div class="profile-board">
            <span id="profName" class="prof-name-ja">---</span>
            <div id="profBio" class="prof-story">---</div>
        </div>
        <div class="btn-back-common" onclick="switchScreen('screen-gallery')">図鑑に戻る</div>
    </div>
    <div id="screen-fullscreen" class="screen"><img id="fullscreenImg" src="" style="width:100%; height:80vh; object-fit:contain;"><div class="btn-back-common" onclick="switchScreen('screen-card-detail')">CLOSE</div></div>
    <div id="screen-combine" class="screen">
        <img src="ui/icon_home.png" class="btn-home-top" onclick="switchScreen('screen-home')">
        <div class="page-title">EVOLUTION</div>
        <div id="combineList" style="width:100%;"></div>
    </div>
</div>

<script>
    const charaProfiles = {
        'rera1': { name: 'ひまり', bio: '明るく人懐っこいムードメーカー。新作スイーツには目がない。' },
        'rare2': { name: '栞', bio: '口数が少なく、感情を出すのが苦手な文学少女。' },
        'rare3': { name: '明日香', bio: 'テニス部の絶対的エース。負けず嫌いな性格。' },
        'rare4': { name: 'すみれ', bio: '大人びたミステリアスなお姉さん。ロマンチスト。' },
        'rare5': { name: '渚', bio: '潮風まとう爽やかマーメイド。アウトドア派。' }
    };

    // --- 【修正】GitHubの拡張子（大文字小文字）を完全に再現 ---
    const evoTree = [
        ['rera1 (1).png', 'rera1 (2).PNG', 'rera1 (3).PNG'],
        ['rare2 (1).png', 'rare2 (2).PNG', 'rare2 (3).PNG'],
        ['rare3 (1).png', 'rare3 (2).PNG', 'rare3 (3).PNG'],
        ['rare4 (1).png', 'rare4 (2).PNG', 'rare4 (3).PNG'],
        ['rare5 (1).png', 'rare5 (2).PNG', 'rare5 (3).PNG']
    ];
    const baseRares = evoTree.map(t => t[0]);
    let data = { rareTotal: 0, normalTotal: 0, inventory: {}, isFirst: true };

    try {
        const saved = localStorage.getItem('compass_v7');
        if (saved) data = JSON.parse(saved);
    } catch (e) {}

    function saveData() { localStorage.setItem('compass_v7', JSON.stringify(data)); }

    function switchScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        if(id === 'screen-home') document.getElementById('homeRandomChara').src = baseRares[0];
        updateUI();
    }

    function executeGacha() {
        let res = [];
        let hasRare = false;
        for (let i = 0; i < 3; i++) {
            if (Math.random() < 0.1 || (data.isFirst && i === 0)) {
                const r = baseRares[Math.floor(Math.random() * baseRares.length)];
                res.push({ type: 'RARE', img: r });
                data.inventory[r] = (data.inventory[r] || 0) + 1;
                data.rareTotal++; hasRare = true;
            } else {
                const n = `normal/normal (${Math.floor(Math.random() * 20) + 1}).png`;
                res.push({ type: 'NORMAL', img: n });
                data.inventory[n] = (data.inventory[n] || 0) + 1;
                data.normalTotal++;
            }
        }
        data.isFirst = false; saveData(); window.pending = res;
        switchScreen('screen-video');
        const v = document.getElementById('gachaVideo');
        v.src = hasRare ? 'bg/gacha_rare.mp4' : 'bg/gacha_normal.mp4';
        v.play().catch(showResult);
        v.onended = showResult;
    }

    function showResult() {
        switchScreen('screen-result');
        const c = document.getElementById('resultDisplay');
        c.innerHTML = '';
        window.pending.forEach(r => { c.innerHTML += `<div class="card"><img src="${r.img}"></div>`; });
    }

    function skipVideo() { document.getElementById('gachaVideo').pause(); showResult(); }

    function openGallery() {
        const g = document.getElementById('galleryGrid');
        g.innerHTML = '<div class="gallery-section-title">RARE</div>';
        evoTree.forEach(tree => tree.forEach(card => {
            const owned = (data.inventory[card] || 0) > 0;
            const item = document.createElement('div');
            item.className = `gallery-item ${owned ? 'owned' : ''}`;
            item.innerHTML = `<img src="${card}">`;
            if (owned) item.onclick = () => showCardDetail(card, 'RARE');
            g.appendChild(item);
        }));
        g.innerHTML += '<div class="gallery-section-title">NORMAL</div>';
        for(let i=1; i<=20; i++){
            const n = `normal/normal (${i}).png`;
            const owned = (data.inventory[n] || 0) > 0;
            const item = document.createElement('div');
            item.className = `gallery-item ${owned ? 'owned' : ''}`;
            item.innerHTML = `<img src="${n}">`;
            if (owned) item.onclick = () => showCardDetail(n, 'NORMAL');
            g.appendChild(item);
        }
        switchScreen('screen-gallery');
    }

    function showCardDetail(img, type) {
        document.getElementById('detailImg').src = img;
        document.getElementById('fullscreenImg').src = img;
        const p = document.getElementById('profileArea');
        if (type === 'RARE') {
            p.style.display = 'block';
            let key = img.includes('rera1') ? 'rera1' : img.split(' ')[0];
            const d = charaProfiles[key] || { name: '分析中', bio: 'データ収集中...' };
            document.getElementById('profName').innerText = d.name;
            document.getElementById('profBio').innerText = d.bio;
        } else { p.style.display = 'none'; }
        switchScreen('screen-card-detail');
    }

    function updateUI() {
        document.getElementById('rareCount').innerText = data.rareTotal;
        document.getElementById('normalCount').innerText = data.normalTotal;
    }

    function openCombine() {
        const l = document.getElementById('combineList'); l.innerHTML = '';
        evoTree.forEach(t => {
            const c = data.inventory[t[0]] || 0;
            if (c > 0) {
                l.innerHTML += `<div class="combine-row"><span>${t[0]} (${c}/5)</span><button onclick="evolve('${t[0]}','${t[1]}')" ${c < 5 ? 'disabled' : ''}>進化</button></div>`;
            }
        });
        switchScreen('screen-combine');
    }

    function evolve(pre, post) {
        data.inventory[pre] -= 5; data.inventory[post] = (data.inventory[post] || 0) + 1;
        saveData(); openCombine(); alert('進化しました！');
    }

    switchScreen('screen-home');
</script>
</body>
</html>
