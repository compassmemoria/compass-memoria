<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Compass Memoria</title>
    <style>
        /* --- 全体・ベース設定 --- */
        body, html { margin: 0; padding: 0; font-family: 'Helvetica Neue', Arial, sans-serif; background: #111; color: #fff; }
        
        .app-container { 
            position: relative; width: 100%; max-width: 500px; margin: 0 auto; min-height: 100vh; 
            background: url('bg/bg_home.png') no-repeat center top / cover fixed; 
            box-shadow: 0 0 20px rgba(0,0,0,0.8); 
            display: flex; flex-direction: column;
        }
        
        /* --- 画面切り替え --- */
        .screen { 
            display: none; flex-direction: column; align-items: center; 
            background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(8px); 
            padding-bottom: 20px; box-sizing: border-box; flex: 1;
        }
        .screen.active { display: flex; }

        /* --- 共通UIパーツ --- */
        .title-logo { width: 80%; max-width: 280px; margin-top: 15px; margin-bottom: 10px; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5)); z-index: 10; }
        .page-title { font-size: 20px; margin: 20px 0; border-bottom: 2px solid gold; padding-bottom: 5px; color: gold; text-shadow: 0 2px 4px #000; letter-spacing: 2px; }
        
        .ui-btn { width: 90%; max-width: 250px; display: block; cursor: pointer; transition: transform 0.1s; margin: 0 auto; }
        .ui-btn:active { transform: scale(0.95); }
        .disabled-btn { filter: grayscale(100%); opacity: 0.5; cursor: not-allowed !important; pointer-events: none; }
        
        .btn-home-top { position: absolute; top: 15px; right: 15px; width: 45px; height: 45px; cursor: pointer; z-index: 50; transition: 0.2s; }

        /* --- ホーム画面 --- */
        #screen-home { justify-content: flex-start; padding-bottom: 0; }
        .status-board { background: rgba(0, 0, 0, 0.7); border: 1px solid #555; border-radius: 10px; padding: 10px 15px; width: 85%; font-size: 13px; line-height: 1.5; text-align: left; margin-bottom: 15px; box-sizing: border-box; z-index: 10; }
        .status-board span { font-weight: bold; color: gold; }
        
        .home-center-chara { flex: 1; width: 100%; display: flex; justify-content: center; align-items: center; overflow: hidden; position: relative; margin-bottom: 10px; }
        .home-center-chara img { max-width: 95%; max-height: 45vh; object-fit: contain; filter: drop-shadow(0 10px 15px rgba(0,0,0,0.8)); animation: float 3s ease-in-out infinite; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }

        .main-menu { display: flex; flex-direction: row; justify-content: center; align-items: flex-end; width: 95%; gap: 15px; margin-top: auto; margin-bottom: 15px; z-index: 10; }
        .menu-item { display: flex; flex-direction: column; align-items: center; cursor: pointer; transition: 0.1s; width: 30%; max-width: 100px; }
        .menu-item:active { transform: scale(0.95); }
        .menu-btn { width: 100%; object-fit: contain; margin-bottom: 5px; pointer-events: none; }
        .menu-text { font-size: 11px; font-weight: bold; color: #fff; text-shadow: 0 2px 4px #000; }

        .ad-banner-space { width: 100%; height: 60px; background: rgba(0,0,0,0.5); display: flex; justify-content: center; align-items: center; color: #888; font-size: 12px; border-top: 1px solid #444; z-index: 10; }

        /* --- ガチャ演出・結果 --- */
        #screen-result { justify-content: center; padding-top: 50px; position: relative; }
        .card-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; margin-bottom: 30px; padding: 0 10px; }
        .card { width: 90px; height: 135px; background: #333; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.5); border: 2px solid #ccc; position: relative; }
        .card img { width: 100%; height: 100%; object-fit: cover; }
        .rare-card { border: 3px solid gold; box-shadow: 0 0 20px gold; transform: scale(1.1); z-index: 10; animation: popup 0.5s ease-out; }
        @keyframes popup { 0% { transform: scale(0); } 80% { transform: scale(1.2); } 100% { transform: scale(1.1); } }
        
        .result-actions { display: flex; flex-direction: column; gap: 20px; width: 100%; align-items: center; }
        .btn-css-ad {
            position: relative; width: 90%; max-width: 280px; padding: 15px 10px;
            background: linear-gradient(45deg, #FFD700, #FFA500);
            color: #fff; font-weight: bold; font-size: 16px; border-radius: 50px; border: 3px solid #fff;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); cursor: pointer; overflow: hidden; display: flex; justify-content: center; align-items: center; gap: 8px; text-shadow: 1px 1px 3px rgba(0,0,0,0.5);
        }
        .btn-css-ad .icon-play { width: 0; height: 0; border-top: 8px solid transparent; border-bottom: 8px solid transparent; border-left: 12px solid #fff; }

        /* --- ギャラリー（一覧） --- */
        .gallery-grid { display: flex; flex-wrap: wrap; gap: 10px; width: 95%; justify-content: center; overflow-y: auto; padding: 10px 0; align-content: flex-start; flex: 1; margin-bottom: 20px; }
        .gallery-item { width: 75px; height: 110px; border-radius: 5px; overflow: hidden; border: 2px solid #444; cursor: pointer; filter: brightness(0.3); transition: 0.3s; position: relative; background: #222; }
        .gallery-item.owned { filter: brightness(1); border-color: gold; box-shadow: 0 0 10px rgba(255,215,0,0.3); }
        .gallery-item.normal-owned { filter: brightness(1); border-color: #888; }
        .gallery-item img { width: 100%; height: 100%; object-fit: cover; pointer-events: none; }

        /* --- カード詳細画面 --- */
        #screen-card-detail { justify-content: flex-start; padding-top: 20px; overflow-y: auto; background: rgba(0,0,0,0.85); }
        .detail-main-visual { position: relative; width: 100%; display: flex; flex-direction: column; align-items: center; margin-bottom: 20px; }
        .detail-img-wrapper { position: relative; width: 75%; max-width: 300px; padding: 10px; background: #000; border: 2px solid gold; border-radius: 15px; box-shadow: 0 0 30px rgba(255,215,0,0.4); cursor: pointer; }
        .detail-img-wrapper img { width: 100%; height: auto; border-radius: 10px; display: block; }
        .detail-zoom-badge { position: absolute; bottom: 15px; right: 15px; background: rgba(0,0,0,0.7); color: gold; padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: bold; border: 1px solid gold; pointer-events: none; }

        .profile-board { width: 92%; background: rgba(20, 20, 20, 0.9); border-radius: 20px; border: 1px solid #444; padding: 25px 20px; box-sizing: border-box; position: relative; margin-bottom: 40px; }
        .prof-header { margin-bottom: 20px; border-left: 4px solid gold; padding-left: 15px; }
        .prof-name-ja { font-size: 26px; font-weight: bold; color: #fff; display: block; margin-bottom: 4px; }
        .prof-catch-line { font-size: 13px; color: #00ffcc; font-weight: bold; letter-spacing: 1px; }
        .prof-story { font-size: 14px; line-height: 1.8; color: #ccc; margin-bottom: 25px; text-align: justify; }
        .prof-quote-box { position: relative; padding: 15px 40px; background: rgba(255,255,255,0.05); border-radius: 10px; }
        .prof-quote-text { font-size: 16px; font-style: italic; color: #fff; }

        .btn-close-detail { width: 80%; background: #333; color: #fff; padding: 14px; border-radius: 30px; border: 1px solid #666; font-weight: bold; cursor: pointer; text-align: center; margin-bottom: 30px; }

        /* --- フルスクリーン --- */
        #screen-fullscreen { background: #000; justify-content: center; align-items: center; position: relative; }
        #fullscreenImg { width: 100%; max-height: 90vh; object-fit: contain; }
        .btn-simple-close { position: absolute; bottom: 30px; background: rgba(255,255,255,0.2); color: #fff; padding: 10px 30px; border-radius: 30px; border: 1px solid #fff; cursor: pointer; }

        /* --- 合成（進化）画面 --- */
        .combine-list { width: 95%; flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding: 10px 0; margin-bottom: 20px; }
        .combine-row { background: rgba(0,0,0,0.8); border: 1px solid #555; border-radius: 10px; padding: 12px; display: flex; justify-content: space-between; align-items: center; }
        .combine-info { display: flex; align-items: center; gap: 15px; }
        .combine-thumb { width: 65px; height: 95px; border-radius: 5px; border: 2px solid #777; overflow: hidden; background: #000; }
        .combine-thumb img { width: 100%; height: 100%; object-fit: contain; } 
        .btn-do-combine { background: linear-gradient(45deg, #ff007f, #ff8c00); color: #fff; border: none; padding: 10px 15px; border-radius: 5px; font-weight: bold; cursor: pointer; }
        .btn-do-combine:disabled { background: #444; color: #888; }
    </style>
</head>
<body>

<div class="app-container">

    <div id="screen-home" class="screen active">
        <img src="ui/title_logp.png" alt="Compass Memoria" class="title-logo">
        <div class="status-board">
            <div>レアカード総数: <span id="rareCount">0</span> 枚</div>
            <div>ノーマルカード: <span id="normalCount">0</span> / 30 枚</div>
            <div>1時間以内の広告視聴: <span id="adCount">0</span> / 10 回</div>
        </div>
        <div class="home-center-chara">
            <img id="homeRandomChara" src="" alt="">
        </div>
        <div class="main-menu">
            <div class="menu-item" onclick="switchScreen('screen-gacha-confirm')">
                <img src="ui/btn_gacha.png" alt="ガチャ" class="menu-btn">
                <div class="menu-text">ガチャ</div>
            </div>
            <div class="menu-item" onclick="openGallery()">
                <img src="ui/icon_gallery.png" alt="ギャラリー" class="menu-btn">
                <div class="menu-text">ギャラリー</div>
            </div>
            <div class="menu-item" onclick="openCombine()">
                <img src="ui/icon_comdine.png" alt="合成" class="menu-btn">
                <div class="menu-text">合成</div>
            </div>
        </div>
        <div id="home-banner" class="ad-banner-space"></div>
    </div>

    <div id="screen-gacha-confirm" class="screen">
        <img src="ui/icon_home.png" alt="ホーム" class="btn-home-top" onclick="switchScreen('screen-home')">
        <div class="page-title">MEMORIAL SPIN</div>
        <div class="confirm-box" id="confirmArea"></div>
    </div>

    <div id="screen-video" class="screen">
        <video id="gachaVideo" playsinline preload="auto" style="width:100%; height:100%; object-fit:cover;"></video>
        <button onclick="skipVideo()" style="position:absolute; bottom:20px; right:20px; background:rgba(0,0,0,0.5); color:#fff; border:none; padding:10px;">スキップ >></button>
    </div>

    <div id="screen-result" class="screen">
        <img src="ui/icon_home.png" alt="ホーム" class="btn-home-top" onclick="switchScreen('screen-home')">
        <div class="page-title">GACHA RESULT</div>
        <div class="card-container" id="resultDisplay"></div>
        <div class="result-actions" id="resultActionArea"></div>
    </div>

    <div id="screen-gallery" class="screen">
        <img src="ui/icon_home.png" alt="ホーム" class="btn-home-top" onclick="switchScreen('screen-home')">
        <div class="page-title">CHARACTER DEX</div>
        <div class="gallery-grid" id="galleryGrid"></div>
        <div class="btn-close-detail" onclick="switchScreen('screen-home')" style="width:60%; margin-top:10px;">閉じる</div>
    </div>

    <div id="screen-card-detail" class="screen">
        <div class="page-title">MEMORY DATA</div>
        <div class="detail-main-visual">
            <div class="detail-img-wrapper" onclick="openFullscreen()">
                <img id="detailImg" src="" alt="">
                <div class="detail-zoom-badge">🔍 TAP TO ZOOM</div>
            </div>
        </div>
        <div id="profileArea" class="profile-board">
            <div class="prof-header">
                <span id="profName" class="prof-name-ja">---</span>
                <span id="profCatch" class="prof-catch-line">---</span>
            </div>
            <div id="profBio" class="prof-story">---</div>
            <div class="prof-quote-box"><div id="profQuote" class="prof-quote-text">---</div></div>
        </div>
        <div class="btn-close-detail" onclick="switchScreen('screen-gallery')">図鑑に戻る</div>
    </div>

    <div id="screen-fullscreen" class="screen">
        <img id="fullscreenImg" src="" alt="">
        <div class="btn-simple-close" onclick="switchScreen('screen-card-detail')">CLOSE</div>
    </div>

    <div id="screen-combine" class="screen">
        <img src="ui/icon_home.png" alt="ホーム" class="btn-home-top" onclick="switchScreen('screen-home')">
        <div class="page-title">EVOLUTION</div>
        <div style="font-size: 12px; margin-bottom: 15px; color: #00ffcc; text-align: center;">素材(第1段階)が5枚必要です</div>
        <div class="combine-list" id="combineList"></div>
    </div>

</div>

<script>
    const charaProfiles = {
        'rera1': { name: 'ひまり (Himari)', catch: '笑顔咲く、甘党ひまわり娘', bio: '明るく人懐っこい性格で、誰とでもすぐに仲良くなれるムードメーカー。休日は話題のカフェ巡りをするのが趣味で、特に新作のパンケーキには目がない。', quote: '「あ、そのケーキ美味しそう！……ひと口、もらってもいい？」' },
        'rare2': { name: '栞 (Shiori)', catch: '本の虫は、静かに恋を知る', bio: '感情を表に出すのが少し苦手な文学少女。休日は一日中図書館に入り浸り、ファンタジーから歴史書まで幅広く読み漁っている。', quote: '「……隣の席、空けておいたから。静かに本を読むなら、座ってもいいわよ」' },
        'rare3': { name: '明日香 (Asuka)', catch: '負けず嫌いな熱血エース', bio: 'テニス部の絶対的エースで、スポーツ万能な元気娘。超がつくほどの負けず嫌いで、何事にも全力でぶつかっていくストレートな性格。', quote: '「ほら、ボケっとしてないで走る！今日の勝負に勝ったら、ジュース奢ってあげるから！」' },
        'rare4': { name: 'すみれ (Sumire)', catch: '暗闇で微笑む、ミステリアス・レディ', bio: '大人びた雰囲気と、どこかミステリアスな色気を漂わせるお姉さん。少しマイナーな単館系の映画や、レイトショーを好む。', quote: '「映画が始まるまで、あと5分……。暗くなるまで、手、繋いでいてもいいかしら？」' },
        'rare5': { name: '渚 (Nagisa)', catch: '潮風まとう、爽やかマーメイド', bio: '海と夏をこよなく愛する、サバサバした性格のアウトドア派。一緒にいるだけで晴れやかな気分になる、開放的な女の子。', quote: '「波の音って落ち着くよね。……ずっとこうして、ふたりで聞いていたいな」' }
    };

    function switchScreen(screenId) {
        document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
        const target = document.getElementById(screenId);
        if(target) target.classList.add('active');
        window.scrollTo(0, 0);
        updateUI();
        const banner = document.getElementById('home-banner');
        banner.style.display = (screenId === 'screen-video' || screenId === 'screen-card-detail' || screenId === 'screen-fullscreen') ? 'none' : 'flex';
        if(screenId === 'screen-home') {
            const randomChara = baseRares[Math.floor(Math.random() * baseRares.length)];
            document.getElementById('homeRandomChara').src = randomChara;
        }
    }

    const RESCUE_LIMIT = 30;
    const AD_LIMIT = 10;
    const normalCount = 20;
    const COMBINE_COST = 5;

    // --- GitHubのバラ置き構造に合わせたパス設定 ---
    const evoTree = [
        ['rera1 (1).png', 'rera1 (2).png', 'rera1 (3).png'],
        ['rare2 (1).png', 'rare2 (2).PNG', 'rare2 (3).PNG'],
        ['rare3 (1).png', 'rare3 (2).PNG', 'rare3 (3).PNG'],
        ['rare4 (1).png', 'rare4 (2).PNG', 'rare4 (3).PNG'],
        ['rare5 (1).png', 'rare5 (2).PNG', 'rare5 (3).PNG']
    ];
    const baseRares = evoTree.map(tree => tree[0]); 
    let data = { rareTotal: 0, normalTotal: 0, adHistory: [], isFirstTime: true, inventory: {}, lastFreeSlot: null };
    try {
        let savedData = localStorage.getItem('compass_memoria_v5');
        if (savedData) data = JSON.parse(savedData);
    } catch (e) {}
    if (!data.inventory) data.inventory = {};
    function saveData() { try { localStorage.setItem('compass_memoria_v5', JSON.stringify(data)); } catch (e) {} }

    function addCardToInventory(imgName, type) {
        if (!data.inventory[imgName]) data.inventory[imgName] = 0;
        data.inventory[imgName]++;
        if (type === 'RARE') data.rareTotal++;
        if (type === 'NORMAL') data.normalTotal++;
    }

    function cleanAdHistory() {
        const now = Date.now();
        data.adHistory = data.adHistory.filter(time => now - time < 3600000);
    }

    function getFreeSpinSlot() {
        const d = new Date();
        const h = d.getHours();
        if (h === 0 || h === 6 || h === 12 || h === 18) return `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}-${h}`;
        return null;
    }

    let pendingResults = [];
    function executeGacha(isRescue = false) {
        pendingResults = [];
        const forceRare = data.isFirstTime;
        const rareProb = isRescue ? 0.30 : 0.02;
        let hasRare = false;
        for (let i = 0; i < 3; i++) {
            if ((forceRare && i === 0) || Math.random() < rareProb) {
                const rareImg = baseRares[Math.floor(Math.random() * baseRares.length)];
                pendingResults.push({ type: 'RARE', img: rareImg });
                addCardToInventory(rareImg, 'RARE');
                hasRare = true;
            } else {
                const normNum = Math.floor(Math.random() * normalCount) + 1;
                const normImg = `normal/normal (${normNum}).png`;
                pendingResults.push({ type: 'NORMAL', img: normImg });
                addCardToInventory(normImg, 'NORMAL');
            }
        }
        if (data.isFirstTime) data.isFirstTime = false;
        if (isRescue) data.normalTotal -= RESCUE_LIMIT;
        saveData();
        playVideo(hasRare);
    }

    const videoElement = document.getElementById('gachaVideo');
    function playVideo(hasRare) {
        switchScreen('screen-video');
        videoElement.src = hasRare ? 'bg/gacha_rare.mp4' : 'bg/gacha_normal.mp4';
        videoElement.play().catch(() => skipVideo());
    }
    videoElement.onended = () => showResult();
    function skipVideo() { videoElement.pause(); showResult(); }

    function showResult() {
        switchScreen('screen-result');
        const container = document.getElementById('resultDisplay');
        container.innerHTML = '';
        pendingResults.forEach(res => {
            const div = document.createElement('div');
            div.className = `card ${res.type === 'RARE' ? 'rare-card' : ''}`;
            div.innerHTML = `<img src="${res.img}">`;
            container.appendChild(div);
        });

        const actionArea = document.getElementById('resultActionArea');
        actionArea.innerHTML = '';
        cleanAdHistory();
        if (data.adHistory.length < AD_LIMIT) {
            const adBtn = document.createElement('div');
            adBtn.className = 'btn-css-ad';
            adBtn.innerHTML = '<div class="icon-play"></div> 広告を見て再挑戦！';
            adBtn.onclick = () => { data.adHistory.push(Date.now()); executeGacha(false); };
            actionArea.appendChild(adBtn);
        }
        const backBtn = document.createElement('img');
        backBtn.src = 'ui/btn_confirm.png';
        backBtn.className = 'ui-btn';
        backBtn.onclick = () => switchScreen('screen-home');
        actionArea.appendChild(backBtn);
    }

    function updateUI() {
        cleanAdHistory();
        document.getElementById('rareCount').innerText = data.rareTotal;
        document.getElementById('normalCount').innerText = data.normalTotal;
        document.getElementById('adCount').innerText = data.adHistory.length;
        const confirmArea = document.getElementById('confirmArea');
        confirmArea.innerHTML = ''; 
        if (data.isFirstTime) {
            const btn = document.createElement('img'); btn.src = 'ui/btn_gacha.png'; btn.className = 'ui-btn';
            btn.onclick = () => executeGacha(false); confirmArea.appendChild(btn); return;
        }
        const freeSlot = getFreeSpinSlot();
        if (freeSlot && data.lastFreeSlot !== freeSlot) {
            const fBtn = document.createElement('img'); fBtn.src = 'ui/btn_gacha.png'; fBtn.className = 'ui-btn';
            fBtn.onclick = () => { data.lastFreeSlot = freeSlot; executeGacha(false); }; confirmArea.appendChild(fBtn);
        }
        const adBtn = document.createElement('img'); adBtn.src = 'ui/btn_gacha_ad.png'; adBtn.className = 'ui-btn';
        if (data.adHistory.length >= AD_LIMIT) adBtn.classList.add('disabled-btn');
        else adBtn.onclick = () => { data.adHistory.push(Date.now()); executeGacha(false); };
        confirmArea.appendChild(adBtn);
        const resBtn = document.createElement('img'); resBtn.src = 'ui/btn_gacha.png'; resBtn.className = 'ui-btn';
        if (data.normalTotal < RESCUE_LIMIT) resBtn.classList.add('disabled-btn');
        else resBtn.onclick = () => executeGacha(true);
        confirmArea.appendChild(resBtn);
    }

    function openGallery() {
        const grid = document.getElementById('galleryGrid'); grid.innerHTML = ''; 
        let unique = 0; evoTree.forEach(tree => { tree.forEach(card => { if (data.inventory[card] > 0) unique++; }); });
        const comp = unique >= 15;

        grid.innerHTML += `<div class="gallery-section-title" style="color:#ff00ff;">COMPLETE REWARD</div>`;
        const compDiv = document.createElement('div');
        compDiv.className = `gallery-item ${comp ? 'owned' : ''}`; compDiv.style.width = '120px'; compDiv.style.height = '170px';
        compDiv.style.borderColor = comp ? '#ff00ff' : '#555';
        compDiv.innerHTML = comp ? `<img src="rare/complete_reward.png">` : `<div style="position:absolute;top:40%;width:100%;text-align:center;font-size:10px;">レアコンプで解放<br>(${unique}/15)</div>`;
        if (comp) compDiv.onclick = () => showCardDetail('rare/complete_reward.png', 'RARE');
        grid.appendChild(compDiv);
        
        grid.innerHTML += `<div class="gallery-section-title">RARE MEMORIES</div>`;
        evoTree.forEach(tree => tree.forEach(card => {
            const count = data.inventory[card] || 0;
            const div = document.createElement('div');
            div.className = `gallery-item ${count > 0 ? 'owned' : ''}`;
            div.innerHTML = `<img src="${card}">`;
            if (count > 0) div.addEventListener('click', () => showCardDetail(card, 'RARE'));
            grid.appendChild(div);
        }));

        grid.innerHTML += `<div class="gallery-section-title">NORMAL MEMORIES</div>`;
        for (let i = 1; i <= normalCount; i++) {
            const card = `normal/normal (${i}).png`; const count = data.inventory[card] || 0;
            const div = document.createElement('div'); div.className = `gallery-item ${count > 0 ? 'normal-owned' : ''}`;
            div.innerHTML = `<img src="${card}">`;
            if (count > 0) div.addEventListener('click', () => showCardDetail(card, 'NORMAL'));
            grid.appendChild(div);
        }
        switchScreen('screen-gallery');
    }

    function showCardDetail(cardName, type) {
        const dImg = document.getElementById('detailImg'); 
        const pArea = document.getElementById('profileArea');
        dImg.src = cardName;
        if(type === 'RARE') {
            pArea.style.display = 'block';
            let profileKey = "";
            if (cardName.includes('rera1')) profileKey = 'rera1';
            else if (cardName.includes('rare2')) profileKey = 'rare2';
            else if (cardName.includes('rare3')) profileKey = 'rare3';
            else if (cardName.includes('rare4')) profileKey = 'rare4';
            else if (cardName.includes('rare5')) profileKey = 'rare5';

            if(profileKey && charaProfiles[profileKey]) { 
                const p = charaProfiles[profileKey]; 
                document.getElementById('profName').innerText = p.name; 
                document.getElementById('profCatch').innerText = p.catch; 
                document.getElementById('profBio').innerText = p.bio; 
                document.getElementById('profQuote').innerText = p.quote; 
            }
        } else { pArea.style.display = 'none'; }
        switchScreen('screen-card-detail');
    }

    function openFullscreen() { document.getElementById('fullscreenImg').src = document.getElementById('detailImg').src; switchScreen('screen-fullscreen'); }

    function openCombine() {
        const list = document.getElementById('combineList'); list.innerHTML = ''; let has = false;
        evoTree.forEach((tree) => {
            const s1 = tree[0]; const c1 = data.inventory[s1] || 0;
            if (c1 > 0) {
                has = true; const can = c1 >= COMBINE_COST; const row = document.createElement('div'); row.className = 'combine-row';
                row.innerHTML = `<div class="combine-info"><div class="combine-thumb"><img src="${s1}"></div><div class="combine-text">1段→2段へ<br>素材(1段): <span>${c1}</span>/5枚</div></div>`;
                const btn = document.createElement('button'); btn.className = 'btn-do-combine'; btn.innerText = '合成'; btn.disabled = !can;
                if (can) btn.onclick = () => { data.inventory[s1] -= COMBINE_COST; data.inventory[tree[1]] = (data.inventory[tree[1]] || 0) + 1; saveData(); alert("進化成功！"); openCombine(); };
                row.appendChild(btn); list.appendChild(row);
            }
            const s2 = tree[1]; const c2 = data.inventory[s2] || 0;
            if (c2 > 0) {
                has = true; const canF = c1 >= COMBINE_COST; const rowF = document.createElement('div'); rowF.className = 'combine-row';
                rowF.innerHTML = `<div class="combine-info"><div class="combine-thumb"><img src="${s2}"></div><div class="combine-text">2段→3段へ<br>素材(1段): <span>${c1}</span>/5枚</div></div>`;
                const btnF = document.createElement('button'); btnF.className = 'btn-do-combine'; btnF.innerText = '最終進化'; btnF.disabled = !canF;
                if (canF) btnF.onclick = () => { data.inventory[s2] -= 1; data.inventory[s1] -= COMBINE_COST; data.inventory[tree[2]] = (data.inventory[tree[2]] || 0) + 1; saveData(); alert("最終進化成功！"); openCombine(); };
                rowF.appendChild(btnF); list.appendChild(rowF);
            }
        });
        if (!has) list.innerHTML = '<div style="text-align:center; color:#aaa; margin-top:50px;">合成可能なカードがありません</div>';
        switchScreen('screen-combine');
    }

    const randomFirst = baseRares[Math.floor(Math.random() * baseRares.length)];
    document.getElementById('homeRandomChara').src = randomFirst;
    updateUI();
</script>
</body>
</html>
